; upload_max_filesize matches GalleryItemStoreRequest's per-file max
; (102400 KB = 100M) — was 64M here, silently failing any video between
; 64-100MB despite the app's own validation allowing it.
upload_max_filesize = 100M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; NOTE: max_file_uploads (PHP default: 20) is NOT settable here — it's a
; PHP_INI_SYSTEM directive, .user.ini can only touch PHP_INI_PERDIR/USER
; ones. Raising it requires the hosting control panel's PHP settings
; (e.g. cPanel "MultiPHP INI Editor" on GoDaddy) or a server-level
; php.ini/vhost change — not something a repo file can override. Until
; that's changed there, the gallery upload form caps batches at 20 files
; client-side so nothing gets silently dropped past that point.
